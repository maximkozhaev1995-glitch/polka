name: Mixora B5 build consistency
on:
  pull_request:
    paths:
      - 'src/stoika.html'
      - 'app/shim.js'
      - 'app/config.js'
      - 'build_app.py'
      - 'index.html'
      - 'tests/**'
      - 'supabase/b5_atomic_stock_PROPOSAL.sql'
      - '.github/workflows/mixora-build-consistency.yml'
  workflow_dispatch:
jobs:
  build-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild staff app
        run: python build_app.py
      - name: Verify committed index.html matches sources
        run: |
          git diff --exit-code -- index.html
          grep -q 'commitStockBatch' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: B5 client recovery and write guards
        run: node tests/b5-client.cjs
      - name: Existing action and matching regressions
        run: |
          node tests/actions.cjs
          node tests/matching.cjs
  database-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: b5-disposable-only
          POSTGRES_DB: mixora_b5_test_ci
        ports:
          - 127.0.0.1:55475:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test driver
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Real PostgreSQL sessions, permissions and transaction regressions
        env:
          B5_ALLOW_TEST_DATABASE: 'YES'
          B5_TEST_DATABASE_URL: postgresql://postgres:b5-disposable-only@127.0.0.1:55475/mixora_b5_test_ci
        run: python tests/b5-database.py
