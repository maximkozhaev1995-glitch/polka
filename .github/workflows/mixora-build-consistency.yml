name: Mixora B5 build consistency
on:
  pull_request:
    paths:
      - 'src/stoika.html'
      - 'app/shim.js'
      - 'app/config.js'
      - 'build_app.py'
      - 'index.html'
      - 'tests/**'
      - 'supabase/b5_atomic_stock_PROPOSAL.sql'
      - '.github/workflows/mixora-build-consistency.yml'
  workflow_dispatch:
jobs:
  build-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild staff app
        run: python build_app.py
      - name: Verify committed index.html matches sources
        run: |
          git diff --exit-code -- index.html
          grep -q 'commitStockBatch' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: B5 client recovery and write guards
        run: node tests/b5-client.cjs
      - name: Existing action and matching regressions
        run: |
          node tests/actions.cjs
          node tests/matching.cjs
